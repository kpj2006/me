name: Remove old HTML site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old hand-written HTML pages and their CSS/JS
        run: |
          git rm -q --ignore-unmatch about.html appearances.html certificates.html contact.html index.html misc.html newsletter.html open-source.html people.html projects.html sponsorship.html stats.html talks.html uses.html videos.html work-with-me.html assets/style.css assets/site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: remove old HTML site (replaced by Astro)"
          git push
