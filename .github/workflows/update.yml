name: Update contributions

# Free on public repos. Runs every day, so the Stats page and README stay fresh
# without anyone pressing a button. The Deploy workflow rebuilds the site after it.
on:
  schedule:
    - cron: "17 2 * * *" # every day 02:17 UTC (07:47 IST)
  workflow_dispatch:
  push:
    paths: ["data/contributions.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch merged PRs and render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: kpj2006
        run: python scripts/update.py
      - name: Fetch GitHub profile stats (followers, stars, contributions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: kpj2006
        run: python scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md domains data/prs.json data/github.json
          git diff --cached --quiet || git commit -m "chore: update contributions and stats"
          git push
